# Ativa usuário default SEM senha e com todas as permissões
# user default on nopass ~* &* +@all

# Desabilita usuário default sem senha
user default off

# # Cria um usuário com senha COM permissão TOTAL
# user <nome> on >senha ~<chaves> &<canais> +<comandos>
user admin on >admin123 ~* &* +@all
