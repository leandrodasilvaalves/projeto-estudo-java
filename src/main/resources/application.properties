spring.application.name=contatos
server.port=8090

# Conexao com o MySQL - ajuste host/porta/schema/usuario/senha conforme seu ambiente
spring.datasource.url=jdbc:mysql://localhost:3306/contatos?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Rabbit
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.queue=queue-name
spring.rabbitmq.exchange=exchange-name

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
topics.contacts=contacts

# Silencia o dump de configuracao do Kafka (ProducerConfig/ConsumerConfig/AdminClientConfig)
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN

# Mongo Db
db.config.uri=mongodb://admin:admin123@localhost:27017/
db.config.database=contacts

# Redis
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=admin123
spring.data.redis.username=admin
