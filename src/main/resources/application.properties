spring.application.name=contatos
server.port=8090

# Conexao com o MySQL - ajuste host/porta/schema/usuario/senha conforme seu ambiente
spring.datasource.url=jdbc:mysql://localhost:3306/contatos?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Rabbit
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka
topics.contacts=contacts
spring.kafka.bootstrap-servers=localhost:9092

# Silencia o dump de configuracao do Kafka (ProducerConfig/ConsumerConfig/AdminClientConfig)
logging.level.org.apache.kafka.clients.producer.ProducerConfig=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN
logging.level.org.apache.kafka.clients.admin.AdminClientConfig=WARN